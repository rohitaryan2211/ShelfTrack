name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 6 * * *'    # 6 AM UTC
    - cron: '0 14 * * *'   # 2 PM UTC
    - cron: '0 22 * * *'   # 10 PM UTC
  workflow_dispatch:  # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        run: |
          set -e  # Exit on error
          response=$(curl -s -w "\n%{http_code}" "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/publishers?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}")
          
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          
          if [ "$http_code" = "200" ]; then
            echo "✓ Ping successful (HTTP 200)"
            echo "Response: $body"
          else
            echo "✗ Ping failed with HTTP $http_code"
            echo "Response: $body"
            exit 1
          fi
      
      - name: Report status
        if: always()
        run: |
          echo "Keep-alive check completed at $(date -u)"
